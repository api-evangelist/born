aid: born
name: Born
description: 'Born (formerly Slay) is a Berlin-based consumer AI company founded in 2022 by
  Fabian Kamberi (CEO), Jannis Ringwald, and Stefan Quernhorst. Born builds AI characters and
  companions designed for shared, social experiences rather than isolating one-to-one chatbots.
  Its flagship product Pengu is a co-parented virtual pet with more than 15 million registered
  users, and the company is expanding into a multi-character platform called Friends and a
  photorealistic voice-and-video companion experience called Life. Since 2022 Born has launched
  five consumer social apps that reached #1 globally on the App Store. It raised a $15M Series A
  in September 2025 (participants include Accel, Tencent, and Laton Ventures), bringing total
  funding to roughly $25M. Born is a consumer mobile-app maker and publishes no public developer
  API, SDK, or documentation surface at this time.'
